# Builds the PolyModLoader copy with PolyRanked pre-installed and publishes it to GitHub Pages.
# One-time setup in the repository settings: Pages -> Source: "GitHub Actions".
# Optional: an Actions variable POLYRANKED_SERVER (e.g. wss://ranked.example.com) is baked in as the default server.
name: Deploy game copy to GitHub Pages

on:
  push:
    # The github-pages environment only accepts deployments from the repository's default branch,
    # which is still claude/charming-gauss-bfnuqd (the first branch pushed). Once main is the default
    # branch and listed under Settings -> Environments -> github-pages, the second entry can go.
    branches: [main, "claude/charming-gauss-bfnuqd"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pushing the same commit to both branches starts two runs; let them queue instead of cancelling
# each other, so the run from the allowed branch always gets to deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Car models of the ported mods (~260 MB, see mods/*/*/assets.json); keyed by their checksums.
      - uses: actions/cache@v4
        with:
          path: .cache/mod-assets
          key: mod-assets-${{ hashFiles('mods/*/*/assets.json') }}
      # Tries to switch Pages on automatically; if the token may not, enable it once under Settings -> Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - run: node tools/build-site.mjs --out dist/site
        env:
          POLYRANKED_DEFAULT_SERVER: ${{ vars.POLYRANKED_SERVER || 'ws://localhost:8788' }}
          # e.g. https://ranked.example.com/kodub when the server runs with kodubProxy.enabled
          POLYRANKED_KODUB_PROXY: ${{ vars.POLYRANKED_KODUB_PROXY || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
